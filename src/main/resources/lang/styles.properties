# Every chat message in the lang files is wrapped in exactly one of two tags:
#   <prefix>...</prefix>                    success and information
#   <prefix_negative>...</prefix_negative>  refusals, limits and warnings
# so the server prefix and the colour scheme are changed here, in one place,
# instead of in every translation. {slot} is the message text.
#
# The shipped defaults show no prefix at all and only colour the text, which is
# how the plugin has always looked. Put your server's prefix in front of {slot}
# in both tags to brand the messages, for example:
#   prefix=<dark_gray>[</dark_gray><green>MyServer</green><dark_gray>]</dark_gray> <text>{slot}</text>
prefix=<text>{slot}</text>
prefix_negative=<negative>{slot}</negative>

# Tone of the message body, shared by the two tags above.
text=<positive>{slot}</positive>
positive=<green>{slot}</green>
negative=<red>{slot}</red>
